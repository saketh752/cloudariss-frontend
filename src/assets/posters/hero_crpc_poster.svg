<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06143D" />
      <stop offset="100%" stop-color="#06143D" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <image href="/brand/hero/hero-crpc-cloud.jpg" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice" opacity="0.8" />
  <rect x="0" y="0" width="960" height="1080" fill="rgba(6,20,61,0.6)" />
  <image href="/brand/cloudariss-logo.png" x="720" y="40" width="480" height="120" preserveAspectRatio="xMidYMid meet" />
  <text x="100" y="360" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#FFFFFF" filter="url(#glow)">CRPC</text>
  <text x="100" y="480" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="96" font-weight="900" fill="#FFB800" filter="url(#glow)">CLOUD & DATA</text>
  <text x="100" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#FFFFFF" letter-spacing="2">CAREER ACCELERATOR PROGRAM</text>
</svg>
